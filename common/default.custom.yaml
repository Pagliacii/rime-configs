    - {accept: bracketright, send: Page_Down, when: has_menu}
  menu:
    page_size: 7
  schema_list:
    - {schema: double_pinyin_flypy}
    - {schema: luna_pinyin_simp}
    - {schema: emoji}
    - {schema: jyutping}
  "translator/preedit_format":
    {}
